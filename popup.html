<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE Reflect - Step by Step</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", system-ui, sans-serif;
    }

    body {
      width: 420px;
      min-height: 640px;
      margin: 0;
      padding: 20px;
      background: linear-gradient(145deg, #eef2ff, #fdf2f8);
      color: #0f172a;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 20px;
      margin-bottom: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      color: #111827;
    }

    .tagline {
      margin: 0;
      font-size: 13px;
      color: #6b7280;
    }

    .progress-wrapper {
      margin: 12px 0 18px 0;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .progress-bar {
      background: #e5e7eb;
      border-radius: 999px;
      height: 6px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.25s ease;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 16px;
      color: #111827;
    }

    textarea {
      width: calc(100% - 20px);
      min-height: 220px;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
      resize: vertical;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-family: inherit;
      background: #f8fafc;
      transition: border 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: #fff;
    }

    .char-counter {
      text-align: right;
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .char-counter.error {
      color: #dc2626;
      font-weight: 600;
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #1f2937;
    }

    .btn-tertiary {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-ai {
      background: linear-gradient(90deg, #f472b6, #f97316);
      color: #fff;
      box-shadow: 0 8px 20px rgba(244, 114, 182, 0.3);
    }

    .status {
      font-size: 13px;
      font-weight: 600;
    }

    .status.success {
      color: #0f9d58;
    }

    .status.error {
      color: #dc2626;
    }

    .feedback {
      margin-top: 16px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 12px;
      font-size: 14px;
      color: #115e38;
      min-height: 40px;
      white-space: pre-line;
    }

    .feedback.loading {
      background: #fff7ed;
      border-color: #fdba74;
      color: #9a3412;
    }

    .summary-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      background: #f9fafb;
    }

    .summary-card h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      color: #0f172a;
    }

    .summary-card p {
      margin: 0;
      font-size: 13px;
      color: #475569;
    }

    .history-section {
      margin-top: 20px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      background: #fff;
    }

    .history-item {
      border-bottom: 1px solid #f1f5f9;
      padding: 10px 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item h4 {
      margin: 0;
      font-size: 14px;
      color: #111827;
    }

    .history-item p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #475569;
    }

    .history-answers p {
      margin: 3px 0;
      font-size: 12px;
      color: #1e293b;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>WISE Reflection</h1>
        <p class="tagline">Think deeper. Grow wiser.</p>
      </div>
      <p id="progressText" class="tagline">Step 1 of 4</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-text">
        <span>Reflection journey</span>
        <span id="progressPct">25%</span>
      </div>
      <div class="progress-bar">
        <span id="progressBarFill" style="width: 25%;"></span>
      </div>
    </div>

    <div id="questionView">
      <label id="question-label" for="reflection">Question 1: What is the purpose of this task?</label>
      <textarea id="reflection" placeholder="Type your answer here..."></textarea>
      <div id="charCounter" class="char-counter">0 / 2000</div>

      <div class="button-row">
        <button id="backBtn" class="btn-secondary hidden" type="button">⬅️ Back</button>
        <button id="saveBtn" class="btn-primary" type="button">💾 Save Reflection</button>
        <span id="saveStatus" class="status hidden">Saved ✅</span>
      </div>
      <div class="button-row">
        <button id="nextBtn" class="btn-primary" type="button">Next</button>
        <button id="clearAllBtn" class="btn-tertiary" type="button">Clear all</button>
      </div>
    </div>

    <div id="summaryView" class="hidden">
      <h2>Summary</h2>
      <p class="tagline">Review your answers and feedback.</p>
      <div id="summaryAnswers"></div>
      <div id="feedback" class="feedback">AI feedback will appear here...</div>
      <div class="button-row">
        <button id="aiFeedbackBtn" class="btn-ai" type="button">🤖 Get AI Feedback</button>
        <button id="editResponsesBtn" class="btn-secondary" type="button">Edit responses</button>
        <button id="clearAllSummaryBtn" class="btn-tertiary" type="button">Clear all</button>
      </div>
    </div>
  </div>

  <div class="card history-section">
    <div class="history-header">
      <div>
        <h3 style="margin:0;">History</h3>
        <p class="tagline">See what you wrote before.</p>
      </div>
      <button id="historyToggleBtn" class="btn-secondary" type="button">View</button>
    </div>
    <div id="historySection" class="hidden">
      <div class="history-list" id="historyList">No reflections saved yet.</div>
      <div class="button-row" style="justify-content: flex-end;">
        <button id="closeHistoryBtn" class="btn-tertiary" type="button">Close history</button>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../popup.js"></script>
</body>
</html>
